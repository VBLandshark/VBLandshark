name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/probe.js
      - run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-out
          git rm -rq --cached .
          git add -f probe-out
          git commit -qm "Probe output [skip netlify]"
          git push -f origin probe-out
